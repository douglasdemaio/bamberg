<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <meta name="color-scheme" content="light dark" />
  <meta name="theme-color" content="#f0ebe1" media="(prefers-color-scheme: light)" />
  <meta name="theme-color" content="#1a1712" media="(prefers-color-scheme: dark)" />
  <title data-i18n="trail_detail.title_fallback">Route – Bamberg Quest</title>
  <meta name="description" content="Kuratierter Spaziergang durch Bamberg." data-i18n-meta="trail_detail.meta_description_fallback" />
  <link rel="stylesheet" href="/css/style.css" />
  <link rel="icon" href="/favicon.ico" />
  <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
  <script>
    (function () {
      try {
        var stored = localStorage.getItem('bq-theme');
        var mode = stored || (window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
        document.documentElement.dataset.theme = mode;
      } catch (_) { document.documentElement.dataset.theme = 'light'; }
      try {
        var lang = localStorage.getItem('bq-lang') || 'de';
        document.documentElement.lang = lang;
      } catch (_) {}
    })();
  </script>
  <style>
    .breadcrumb { padding: 1rem 0; font-size: 0.85rem; display: flex; gap: 1rem; }
    .trail-header { margin-bottom: 2rem; }
    .trail-header h1 { font-size: 1.5rem; }
    .trail-subtitle { font-size: 0.9rem; color: var(--text-muted); margin-bottom: 1rem; }
    .trail-stats { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-bottom: 1rem; }
    .stat { display: flex; flex-direction: column; align-items: center; padding: 0.5rem 0.75rem; background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); min-width: 70px; }
    .stat-value { font-weight: 700; font-size: 0.9rem; }
    .stat-label { font-size: 0.65rem; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.05em; }
    .trail-description { font-size: 0.9rem; }
    .trail-sites h2 { font-size: 1.1rem; margin-bottom: 0.75rem; }
    .trail-notice { padding: 0.5rem 0.75rem; background: #f5edd6; border-radius: var(--radius); border: 1px solid var(--amber); font-size: 0.8rem; margin-bottom: 1rem; }
    .stop-list { list-style: none; counter-reset: stops; display: flex; flex-direction: column; gap: 0.5rem; }
    .stop-item { display: flex; align-items: center; gap: 0.75rem; padding: 0.75rem 1rem; background: var(--card-bg); border-radius: var(--radius); border: 1px solid var(--border); transition: border-color 0.15s; }
    .stop-claimed { border-color: var(--verdigris); opacity: 0.85; }
    .stop-num { font-family: var(--font-mono); font-size: 1.1rem; font-weight: 700; color: var(--text-muted); min-width: 1.5rem; text-align: center; }
    .stop-info { display: flex; flex-wrap: wrap; align-items: baseline; gap: 0.25rem 0.75rem; flex: 1; }
    .stop-name { font-weight: 600; font-size: 0.95rem; }
    .stop-en { font-size: 0.8rem; color: var(--text-muted); }
    .stop-tier { font-size: 0.65rem; text-transform: uppercase; letter-spacing: 0.05em; padding: 0.1rem 0.3rem; border-radius: 3px; font-family: var(--font-mono); font-weight: 600; }
    .tier-gold { background: var(--amber); color: var(--paper); }
    .tier-silver { background: #b0b0a8; color: var(--paper); }
    .tier-bronze { background: #c49a6a; color: var(--paper); }
    .page-footer { padding: 2rem 0; font-size: 0.85rem; }
  </style>
  <!-- Google tag (gtag.js) -->
  <script async src="https://www.googletagmanager.com/gtag/js?id=G-6Y3GH8HZRT"></script>
  <script>
    window.dataLayer = window.dataLayer || [];
    function gtag(){dataLayer.push(arguments);}
    gtag('js', new Date());

    gtag('config', 'G-6Y3GH8HZRT');
  </script>
</head>
<body>
  <a class="skip-link" href="#content" id="skip-link">Zum Inhalt springen</a>
  <div class="container">
    <div class="topbar">
      <select class="lang-select" id="lang-select" aria-label="Sprache / Language" data-i18n-aria="site.language_label">
        <option value="de">🇩🇪 Deutsch</option>
        <option value="en">🇬🇧 English</option>
        <option value="fr">🇫🇷 Français</option>
        <option value="it">🇮🇹 Italiano</option>
        <option value="es">🇪🇸 Español</option>
        <option value="nl">🇳🇱 Nederlands</option>
        <option value="cs">🇨🇿 Čeština</option>
        <option value="pt">🇵🇹 Português</option>
        <option value="sv">🇸🇪 Svenska</option>
        <option value="zh">🇨🇳 中文</option>
        <option value="hi">🇮🇳 हिन्दी</option>
        <option value="ja">🇯🇵 日本語</option>
        <option value="tr">🇹🇷 Türkçe</option>
        <option value="ru">🇷🇺 Русский</option>
      </select>
      <button type="button" class="theme-toggle" id="theme-toggle" aria-label="Farbmodus wechseln / Toggle color mode" title="Farbmodus wechseln / Toggle color mode">
        <span class="toggle-icon-light" aria-hidden="true">☀︎</span>
        <span class="toggle-icon-dark" aria-hidden="true">☾</span>
        <span class="toggle-label"><span class="toggle-icon-light" aria-hidden="true" data-i18n="site.theme_light">Hell</span><span class="toggle-icon-dark" aria-hidden="true" data-i18n="site.theme_dark">Dunkel</span></span>
      </button>
    </div>
    <div id="content">
      <div id="trail-root"></div>
    </div>
  </div>
  <script src="/js/game.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/shared.js"></script>
  <script>
  function getQueryParam(name) {
    var params = new URLSearchParams(window.location.search);
    return params.get(name);
  }

  var slug = getQueryParam('slug');
  var loadedTrail = null;
  var loadedSites = null;

  function renderTrail(trail, sites) {
    var root = document.getElementById('trail-root');
    var lang = document.documentElement.lang || 'de';
    var pickLang = window.__bqPickLang || function(o){ return (o && (o[lang] || o.en || o.de)) || ''; };
    var t = window.__bqt || function(k){ return k; };

    if (!trail) {
      root.innerHTML = '<p>' + t('trail_detail.not_found', lang) + ' <a href="/trails.html" data-i18n="nav.all_trails">← Alle Routen</a></p>';
      if (typeof window.__applyBqTranslations === 'function') window.__applyBqTranslations(lang);
      return;
    }

    var trailSites = trail.sites.map(function(slug) {
      for (var i = 0; i < sites.length; i++) {
        if (sites[i].slug === slug) return sites[i];
      }
      return null;
    }).filter(Boolean);

    var allAvailable = trailSites.length === trail.sites.length;

    var localTrailName = pickLang(trail.name || {}, lang);
    var localTrailDesc = pickLang(trail.description || {}, lang);
    var titleSuffix = ' – Bamberg Quest';
    document.title = (localTrailName || t('trail_detail.title_fallback', lang)) + titleSuffix;
    var metaDesc = document.querySelector('meta[name="description"]');
    if (metaDesc) metaDesc.content = localTrailDesc || t('trail_detail.meta_description_fallback', lang);

    var html = '<nav class="breadcrumb" aria-label="Brotkrümelnavigation" data-i18n-aria="site.breadcrumb_aria"><a href="/trails.html">← <span data-i18n="nav.all_trails">Alle Routen</span></a> <a href="/index.html"><span data-i18n="nav.overview">Übersicht</span></a></nav>';
    html += '<article>';
    html += '<header class="trail-header">';
    html += '<h1>' + (trail.icon || '') + ' ' + localTrailName + '</h1>';
    html += '<div class="trail-stats">' +
      '<div class="stat"><span class="stat-value">' + (trail.distance_km || '') + ' km</span><span class="stat-label" data-i18n="trail_route">Strecke</span></div>' +
      '<div class="stat"><span class="stat-value">' + (trail.elevation_m || '') + ' m</span><span class="stat-label" data-i18n="trail_climb">Aufstieg</span></div>' +
      '<div class="stat"><span class="stat-value">' + (trail.duration || '') + '</span><span class="stat-label" data-i18n="trail_duration">Dauer</span></div>' +
      '<div class="stat"><span class="stat-value">' + (trail.pace || '') + '</span><span class="stat-label" data-i18n="trail_pace">Tempo</span></div>' +
      (trail.step_free ? '<div class="stat"><span class="stat-value">♿</span><span class="stat-label" data-i18n="trail_step_free">Schritt-frei</span></div>' : '') +
    '</div>';
    html += '<p class="trail-description">' + localTrailDesc + '</p>';
    html += '</header>';

    html += '<section class="trail-sites">';
    html += '<h2><span data-i18n="trail_subtitle">Stationen</span></h2>';

    if (!allAvailable) {
      var missing = trail.sites.length - trailSites.length;
      html += '<div class="trail-notice">⚠️ <span data-i18n="trail_missing_stops" data-i18n-params=\'{"count":"' + missing + '"}\'>' + missing + ' Stationen fehlen noch im Guidebook.</span></div>';
    }

    html += '<ol class="stop-list" id="stop-list">';
    trail.sites.forEach(function(stopSlug, i) {
      var site = null;
      for (var j = 0; j < sites.length; j++) {
        if (sites[j].slug === stopSlug) { site = sites[j]; break; }
      }
      if (!site) return;
      html += '<li class="stop-item" id="stop-' + stopSlug + '" data-slug="' + stopSlug + '">' +
        '<span class="stop-num">' + (i + 1) + '</span>' +
        '<div class="stop-info">' +
          '<a href="/site.html?slug=' + stopSlug + '" class="stop-name">' + pickLang(site.name, lang) + '</a>' +
          '<span class="stop-tier tier-' + site.tier + '" data-i18n="tier_short.' + site.tier + '">' + site.tier + '</span>' +
        '</div>' +
      '</li>';
    });
    html += '</ol>';
    html += '</section></article>';
    html += '<footer class="page-footer"><a href="/trails.html">← <span data-i18n="nav.all_trails">Alle Routen</span></a></footer>';

    root.innerHTML = html;

    // Mark claimed stops
    var slugs = trail.sites || [];
    slugs.forEach(function(slug) {
      var stop = document.getElementById('stop-' + slug);
      if (stop && isClaimed(slug)) stop.classList.add('stop-claimed');
    });

    if (typeof window.__applyBqTranslations === 'function') {
      window.__applyBqTranslations(lang);
    }
  }

  if (slug) {
    Promise.all([
      fetch('/data/sites.json').then(function(r) { return r.json(); }),
      fetch('/data/trails.json').then(function(r) { return r.json(); })
    ]).then(function(results) {
      var sites = results[0];
      var trails = results[1];
      var trail = null;
      for (var i = 0; i < trails.length; i++) {
        if (trails[i].id === slug) { trail = trails[i]; break; }
      }
      loadedTrail = trail;
      loadedSites = sites;
      renderTrail(trail, sites);
    });
  } else {
    var lang = document.documentElement.lang || 'de';
    var tt = window.__bqt || function(k){ return k; };
    document.getElementById('trail-root').innerHTML = '<p>' + tt('trail_detail.none_selected', lang) + ' <a href="/trails.html" data-i18n="nav.all_trails">← Alle Routen</a></p>';
    if (typeof window.__applyBqTranslations === 'function') window.__applyBqTranslations(lang);
  }

  document.addEventListener('bq:translations-loaded', function() {
    if (loadedSites) renderTrail(loadedTrail, loadedSites);
    else if (!slug) {
      var lang = document.documentElement.lang || 'de';
      document.getElementById('trail-root').innerHTML = '<p>' + window.__bqt('trail_detail.none_selected', lang) + ' <a href="/trails.html" data-i18n="nav.all_trails">← Alle Routen</a></p>';
      window.__applyBqTranslations(lang);
    }
  });
  </script>
</body>
</html>
